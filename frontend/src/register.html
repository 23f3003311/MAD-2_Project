<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PPA — Register</title>
  <meta name="description" content="Create your student or company account on the Placement Portal." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root {
      --bg:#0d1117;--surface:#161b22;--border:#30363d;
      --primary:#2563eb;--text:#e6edf3;--muted:#8b949e;
      --success:#3fb950;--danger:#f85149;
    }
    body { background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
           min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px; }
    .reg-wrap { width:100%;max-width:520px; }
    .brand { text-align:center;margin-bottom:24px; }
    .brand .logo { width:48px;height:48px;background:var(--primary);border-radius:12px;
                   display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px; }
    .brand h1 { font-size:20px;font-weight:700;margin:0; }
    .brand p { color:var(--muted);font-size:13px;margin:4px 0 0; }
    .card { background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px; }
    .tab-row { display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:4px;margin-bottom:24px; }
    .tab-btn { flex:1;padding:8px;border:none;border-radius:6px;background:transparent;
               color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s; }
    .tab-btn.active { background:var(--primary);color:#fff; }
    .form-label { color:var(--muted);font-size:13px;font-weight:500;margin-bottom:5px; }
    .form-control { background:var(--bg);border:1px solid var(--border);color:var(--text);
                    border-radius:8px;padding:9px 13px;font-size:14px;transition:border-color .2s; }
    .form-control:focus { background:var(--bg);border-color:var(--primary);
                          box-shadow:0 0 0 3px rgba(37,99,235,.2);color:var(--text); }
    .form-control::placeholder { color:var(--muted); }
    .form-select { background:var(--bg);border:1px solid var(--border);color:var(--text);
                   border-radius:8px;padding:9px 13px;font-size:14px; }
    .form-select:focus { background:var(--bg);border-color:var(--primary);
                         box-shadow:0 0 0 3px rgba(37,99,235,.2);color:var(--text); }
    .form-select option { background:var(--surface);color:var(--text); }
    .btn-primary { background:var(--primary);border:none;border-radius:8px;
                   padding:10px;font-weight:600;font-size:15px;transition:all .2s; }
    .btn-primary:hover { background:#1d4ed8;transform:translateY(-1px); }
    .alert-box { border-radius:8px;padding:12px 16px;font-size:14px;display:flex;
                 align-items:center;gap:8px;margin-bottom:14px; }
    .alert-danger { background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.3);color:var(--danger); }
    .alert-success { background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.3);color:var(--success); }
    .login-link { text-align:center;margin-top:16px;font-size:14px;color:var(--muted); }
    .login-link a { color:var(--primary);text-decoration:none;font-weight:500; }
    .section-title { font-size:13px;font-weight:600;color:var(--muted);
                     text-transform:uppercase;letter-spacing:.8px;margin:20px 0 12px; }
    .spinner { width:16px;height:16px;border:2px solid rgba(255,255,255,.3);
               border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
  </style>
</head>
<body>
{% raw %}
<div id="app" class="reg-wrap">
  <div class="brand">
    <div class="logo"><i class="bi bi-mortarboard-fill fs-5 text-white"></i></div>
    <h1>Create Account</h1>
    <p>Join the Institute Placement Portal</p>
  </div>

  <div class="card">
    <div class="tab-row">
      <button class="tab-btn" :class="{active:role==='student'}" @click="role='student';clear()">
        <i class="bi bi-person-fill me-1"></i>Student
      </button>
      <button class="tab-btn" :class="{active:role==='company'}" @click="role='company';clear()">
        <i class="bi bi-building me-1"></i>Company
      </button>
    </div>

    <div v-if="error" class="alert-box alert-danger"><i class="bi bi-exclamation-triangle-fill"></i> {{ error }}</div>
    <div v-if="success" class="alert-box alert-success"><i class="bi bi-check-circle-fill"></i> {{ success }}</div>

    <form @submit.prevent="register" novalidate>
      
      <p class="section-title">Account Details</p>
      <div class="row g-3 mb-3">
        <div class="col-12">
          <label class="form-label">Email Address *</label>
          <input id="reg-email" v-model="form.email" type="email" class="form-control"
                 placeholder="you@example.com" required />
        </div>
        <div class="col-sm-6">
          <label class="form-label">Password *</label>
          <input id="reg-password" v-model="form.password" type="password" class="form-control"
                 placeholder="Min. 6 characters" required minlength="6" />
        </div>
        <div class="col-sm-6">
          <label class="form-label">Confirm Password *</label>
          <input id="reg-confirm" v-model="form.confirm" type="password" class="form-control"
                 placeholder="Repeat password" required />
        </div>
      </div>

      
      <template v-if="role==='student'">
        <p class="section-title">Student Information</p>
        <div class="row g-3 mb-3">
          <div class="col-sm-6">
            <label class="form-label">Full Name *</label>
            <input id="reg-fullname" v-model="form.full_name" type="text" class="form-control"
                   placeholder="Aarav Kumar" required />
          </div>
          <div class="col-sm-6">
            <label class="form-label">Roll Number *</label>
            <input id="reg-roll" v-model="form.roll_number" type="text" class="form-control"
                   placeholder="21CS001" required />
          </div>
          <div class="col-sm-6">
            <label class="form-label">Branch *</label>
            <select id="reg-branch" v-model="form.branch" class="form-select" required>
              <option value="">Select Branch</option>
              <option v-for="b in branches" :key="b" :value="b">{{ b }}</option>
            </select>
          </div>
          <div class="col-sm-3">
            <label class="form-label">Year *</label>
            <select id="reg-year" v-model="form.year" class="form-select" required>
              <option value="">Yr</option>
              <option value="1">1st</option>
              <option value="2">2nd</option>
              <option value="3">3rd</option>
              <option value="4">4th</option>
            </select>
          </div>
          <div class="col-sm-3">
            <label class="form-label">CGPA *</label>
            <input id="reg-cgpa" v-model="form.cgpa" type="number" class="form-control"
                   placeholder="8.5" min="0" max="10" step="0.01" required />
          </div>
          <div class="col-sm-6">
            <label class="form-label">Phone</label>
            <input id="reg-phone" v-model="form.phone" type="tel" class="form-control"
                   placeholder="+91 98765 43210" />
          </div>
        </div>
      </template>

      
      <template v-if="role==='company'">
        <p class="section-title">Company Information</p>
        <div class="row g-3 mb-3">
          <div class="col-12">
            <label class="form-label">Company Name *</label>
            <input id="reg-company" v-model="form.company_name" type="text" class="form-control"
                   placeholder="Acme Technologies Pvt. Ltd." required />
          </div>
          <div class="col-sm-6">
            <label class="form-label">HR Contact Name</label>
            <input id="reg-hr" v-model="form.hr_contact" type="text" class="form-control"
                   placeholder="Priya Sharma" />
          </div>
          <div class="col-sm-6">
            <label class="form-label">Industry</label>
            <select id="reg-industry" v-model="form.industry" class="form-select">
              <option value="">Select Industry</option>
              <option v-for="ind in industries" :key="ind" :value="ind">{{ ind }}</option>
            </select>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Website</label>
            <input id="reg-website" v-model="form.website" type="url" class="form-control"
                   placeholder="https://company.com" />
          </div>
          <div class="col-sm-6">
            <label class="form-label">Phone</label>
            <input id="reg-co-phone" v-model="form.phone" type="tel" class="form-control"
                   placeholder="+91 22 1234 5678" />
          </div>
          <div class="col-12">
            <label class="form-label">Company Description</label>
            <textarea id="reg-desc" v-model="form.description" class="form-control"
                      rows="3" placeholder="Brief about your company…"></textarea>
          </div>
        </div>
        <div class="alert-box" style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);color:#fbbf24;font-size:13px;">
          <i class="bi bi-info-circle"></i>
          Company accounts require admin approval before you can log in and create drives.
        </div>
      </template>

      <button id="reg-btn" type="submit" class="btn btn-primary w-100 mt-2" :disabled="loading">
        <span v-if="loading" class="spinner d-inline-block me-2"></span>
        {{ loading ? 'Creating account…' : `Register as ${role === 'student' ? 'Student' : 'Company'}` }}
      </button>
    </form>

    <div class="login-link">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref, reactive } = Vue;
createApp({
  setup() {
    const params = new URLSearchParams(window.location.search);
    const role = ref(['student','company'].includes(params.get('role')) ? params.get('role') : 'student');
    const loading = ref(false);
    const error = ref('');
    const success = ref('');
    const form = reactive({
      email:'',password:'',confirm:'',
      full_name:'',roll_number:'',branch:'',year:'',cgpa:'',phone:'',
      company_name:'',hr_contact:'',industry:'',website:'',description:'',
    });
    const branches = ['Computer Science','Information Technology','Electronics & Communication',
      'Electrical Engineering','Mechanical Engineering','Civil Engineering',
      'Chemical Engineering','Biotechnology','Mathematics & Computing'];
    const industries = ['Software / IT','Banking & Finance','Consulting','Manufacturing',
      'Healthcare','E-Commerce','Telecom','Automotive','Energy','Other'];

    function clear() { error.value=''; success.value=''; }

    async function register() {
      error.value=''; success.value='';
      if (!form.email || !form.password) { error.value='Email and password are required.'; return; }
      if (form.password.length < 6) { error.value='Password must be at least 6 characters.'; return; }
      if (form.password !== form.confirm) { error.value='Passwords do not match.'; return; }

      if (role.value === 'student') {
        if (!form.full_name || !form.roll_number || !form.branch || !form.year) {
          error.value='Please fill in all required student fields.'; return;
        }
        const cgpa = parseFloat(form.cgpa);
        if (isNaN(cgpa) || cgpa < 0 || cgpa > 10) {
          error.value='CGPA must be between 0 and 10.'; return;
        }
      }
      if (role.value === 'company' && !form.company_name) {
        error.value='Company name is required.'; return;
      }

      loading.value = true;
      try {
        const payload = { email: form.email, password: form.password, role: role.value };
        if (role.value === 'student') {
          Object.assign(payload, {
            full_name: form.full_name, roll_number: form.roll_number,
            branch: form.branch, year: parseInt(form.year),
            cgpa: parseFloat(form.cgpa), phone: form.phone,
          });
        } else {
          Object.assign(payload, {
            company_name: form.company_name, hr_contact: form.hr_contact,
            industry: form.industry, website: form.website,
            description: form.description,
          });
        }
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!data.success) { error.value = data.message; return; }
        success.value = data.message + ' Redirecting to login…';
        setTimeout(() => window.location.href = '/login?role=' + role.value, 2000);
      } catch(e) {
        error.value = 'Network error. Please try again.';
      } finally {
        loading.value = false;
      }
    }

    return { role, loading, error, success, form, branches, industries, clear, register };
  }
}).mount('#app');
</script>
{% endraw %}
</body>
</html>
