<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PPA — Login</title>
  <meta name="description" content="Login to the Institute Placement Portal — students, companies, and admins." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #e6edf3;
      --muted: #8b949e;
      --success: #3fb950;
      --danger: #f85149;
      --warning: #d29922;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-wrap {
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand .logo {
      width: 56px;
      height: 56px;
      background: var(--primary);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .brand h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
    }

    .brand p {
      color: var(--muted);
      font-size: 14px;
      margin: 4px 0 0;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
    }

    .tab-row {
      display: flex;
      gap: 4px;
      background: var(--bg);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .form-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .form-control {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      transition: border-color .2s;
    }

    .form-control:focus {
      background: var(--bg);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .2);
      color: var(--text);
    }

    .form-control::placeholder {
      color: var(--muted);
    }

    .btn-primary {
      background: var(--primary);
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: 600;
      font-size: 15px;
      transition: all .2s;
      letter-spacing: .3px;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .alert-box {
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .alert-danger {
      background: rgba(248, 81, 73, .12);
      border: 1px solid rgba(248, 81, 73, .3);
      color: var(--danger);
    }

    .divider {
      border-top: 1px solid var(--border);
      margin: 20px 0;
      text-align: center;
      position: relative;
    }

    .divider span {
      position: relative;
      top: -10px;
      background: var(--surface);
      padding: 0 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .register-link {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: var(--muted);
    }

    .register-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .cred-hint {
      background: rgba(45, 212, 191, .08);
      border: 1px solid rgba(45, 212, 191, .2);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #5eead4;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>
  {% raw %}
  <div id="app" class="login-wrap">
    <div class="brand">
      <div class="logo"><i class="bi bi-mortarboard-fill fs-4 text-white"></i></div>
      <h1>Placement Portal</h1>
      <p>Institute Recruitment Management System</p>
    </div>

    <div class="card">
      <div class="tab-row">
        <button class="tab-btn" :class="{active: tab==='student'}" @click="tab='student'; error=''">
          <i class="bi bi-person-fill me-1"></i>Student
        </button>
        <button class="tab-btn" :class="{active: tab==='company'}" @click="tab='company'; error=''">
          <i class="bi bi-building me-1"></i>Company
        </button>
        <button class="tab-btn" :class="{active: tab==='admin'}" @click="tab='admin'; error=''">
          <i class="bi bi-shield-lock me-1"></i>Admin
        </button>
      </div>

      <div v-if="tab==='admin'" class="cred-hint">
        <i class="bi bi-info-circle me-1"></i>
        Default admin: <strong>tiwarisibani0@gmail.com</strong> / <strong>Admin@123</strong>
      </div>

      <div v-if="error" class="alert-box alert-danger">
        <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
      </div>

      <form @submit.prevent="login" novalidate>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input id="login-email" v-model="email" type="email" class="form-control" placeholder="you@example.com"
            required autocomplete="email" />
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <div class="position-relative">
            <input id="login-password" v-model="password" :type="showPass ? 'text' : 'password'"
              class="form-control pe-5" placeholder="••••••••" required />
            <button type="button" @click="showPass=!showPass" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);
                         background:none;border:none;color:var(--muted);cursor:pointer;">
              <i :class="showPass ? 'bi-eye-slash' : 'bi-eye'" class="bi"></i>
            </button>
          </div>
        </div>
        <button id="login-btn" type="submit" class="btn btn-primary w-100" :disabled="loading">
          <span v-if="loading" class="spinner d-inline-block me-2"></span>
          <span v-if="!loading"><i class="bi bi-box-arrow-in-right me-1"></i></span>
          {{ loading ? 'Signing in…' : 'Sign In' }}
        </button>
      </form>

      <div v-if="tab !== 'admin'" class="register-link">
        Don't have an account?
        <a :href="'/register?role=' + tab">Create one</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    const { createApp, ref } = Vue;
    createApp({
      setup() {
        const tab = ref('student');
        const email = ref('');
        const password = ref('');
        const showPass = ref(false);
        const loading = ref(false);
        const error = ref('');

        // Auto-fill role based on query param
        const params = new URLSearchParams(window.location.search);
        if (['student', 'company', 'admin'].includes(params.get('role'))) {
          tab.value = params.get('role');
        }

        // Already logged in?
        const existingToken = localStorage.getItem('ppa_token');
        const existingRole = localStorage.getItem('ppa_role');
        if (existingToken && existingRole) {
          window.location.href = `/${existingRole}/dashboard`;
        }

        async function login() {
          error.value = '';
          if (!email.value || !password.value) {
            error.value = 'Please enter your email and password.';
            return;
          }
          loading.value = true;
          try {
            const res = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: email.value, password: password.value }),
            });
            const data = await res.json();
            if (!data.success) {
              error.value = data.message || 'Login failed.';
              return;
            }
            // Store auth data
            localStorage.setItem('ppa_token', data.data.token);
            localStorage.setItem('ppa_role', data.data.role);
            localStorage.setItem('ppa_user_id', data.data.user_id);
            localStorage.setItem('ppa_name', data.data.name);
            localStorage.setItem('ppa_email', data.data.email);
            if (data.data.profile_id) {
              localStorage.setItem('ppa_profile_id', data.data.profile_id);
            }
            window.location.href = `/${data.data.role}/dashboard`;
          } catch (e) {
            error.value = 'Network error. Please try again.';
          } finally {
            loading.value = false;
          }
        }

        return { tab, email, password, showPass, loading, error, login };
      }
    }).mount('#app');
  </script>
  {% endraw %}
</body>

</html>
