<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Dashboard — PPA</title>
  <meta name="description" content="Admin dashboard for managing placements, companies, and students."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;
          --primary:#2563eb;--text:#e6edf3;--muted:#8b949e;
          --success:#3fb950;--danger:#f85149;--warning:#d29922;--info:#58a6ff;}
    *{box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;margin:0;}
    
    .sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;background:var(--surface);
             border-right:1px solid var(--border);display:flex;flex-direction:column;
             z-index:100;overflow-y:auto;}
    .sidebar-brand{padding:20px 16px;border-bottom:1px solid var(--border);}
    .sidebar-brand .logo{width:36px;height:36px;background:var(--primary);border-radius:8px;
                         display:inline-flex;align-items:center;justify-content:center;}
    .sidebar-brand span{font-weight:700;font-size:15px;margin-left:10px;vertical-align:middle;}
    .sidebar-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;
                   letter-spacing:.8px;padding:16px 16px 6px;}
    .nav-link{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--muted);
              font-size:14px;border-radius:8px;margin:2px 8px;text-decoration:none;transition:all .2s;}
    .nav-link:hover,.nav-link.active{background:rgba(37,99,235,.15);color:var(--primary);}
    .nav-link i{font-size:16px;width:18px;}
    .sidebar-footer{margin-top:auto;padding:16px;border-top:1px solid var(--border);}
    .user-pill{display:flex;align-items:center;gap:10px;}
    .user-avatar{width:34px;height:34px;background:var(--primary);border-radius:50%;
                 display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
    .user-info{flex:1;overflow:hidden;}
    .user-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .user-role{font-size:11px;color:var(--muted);}
    
    .main{margin-left:240px;min-height:100vh;}
    .topbar{background:var(--surface);border-bottom:1px solid var(--border);
            padding:14px 28px;display:flex;align-items:center;justify-content:space-between;
            position:sticky;top:0;z-index:50;}
    .topbar h2{font-size:18px;font-weight:600;margin:0;}
    .content{padding:28px;}
    
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
               padding:20px;position:relative;overflow:hidden;transition:transform .2s;}
    .stat-card:hover{transform:translateY(-2px);}
    .stat-card .icon{width:44px;height:44px;border-radius:10px;display:flex;
                     align-items:center;justify-content:center;font-size:20px;}
    .stat-card .num{font-size:32px;font-weight:700;margin:8px 0 2px;}
    .stat-card .label{font-size:13px;color:var(--muted);}
    .stat-card .badge-pill{position:absolute;top:16px;right:16px;font-size:11px;
                           padding:3px 8px;border-radius:999px;}
    
    .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;}
    .chart-card h5{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--text);}
    
    .data-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;}
    .data-card-header{padding:16px 20px;border-bottom:1px solid var(--border);
                      display:flex;align-items:center;justify-content:space-between;}
    .data-card-header h5{margin:0;font-size:15px;font-weight:600;}
    .table{--bs-table-bg:transparent;--bs-table-hover-bg:rgba(255,255,255,.04);
           --bs-table-color:var(--text);--bs-table-border-color:var(--border);
           font-size:14px;margin:0;}
    .table th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;
              letter-spacing:.5px;border-bottom:1px solid var(--border)!important;padding:12px 16px;}
    .table td{padding:12px 16px;vertical-align:middle;border-bottom:1px solid rgba(48,54,61,.6);}
    .table tbody tr:last-child td{border-bottom:none;}
    .badge{font-size:11px;font-weight:500;padding:4px 10px;border-radius:999px;}
    .btn-sm{font-size:12px;padding:4px 12px;border-radius:6px;}
    .search-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;
                color:var(--text);padding:8px 14px;font-size:14px;width:260px;}
    .search-box:focus{border-color:var(--primary);outline:none;
                      box-shadow:0 0 0 3px rgba(37,99,235,.2);}
    .search-box::placeholder{color:var(--muted);}
    .loading-spinner{display:flex;align-items:center;justify-content:center;
                     padding:48px;color:var(--muted);}
    .pulse{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);
           border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
{% raw %}
<div id="app">
  
  <nav class="sidebar">
    <div class="sidebar-brand">
      <div class="logo d-inline-flex"><i class="bi bi-mortarboard-fill text-white"></i></div>
      <span>PPA Admin</span>
    </div>
    <div class="sidebar-label">Navigation</div>
    <a href="/admin/dashboard" class="nav-link active"><i class="bi bi-grid-1x2"></i> Dashboard</a>
    <a href="/admin/companies" class="nav-link"><i class="bi bi-building"></i> Companies</a>
    <a href="/admin/students" class="nav-link"><i class="bi bi-people"></i> Students</a>
    <a href="/admin/drives" class="nav-link"><i class="bi bi-briefcase"></i> Drives</a>

    <div class="sidebar-footer">
      <div class="user-pill">
        <div class="user-avatar">A</div>
        <div class="user-info">
          <div class="user-name">Admin</div>
          <div class="user-role">Institute Placement Cell</div>
        </div>
        <button @click="logout" class="btn btn-link p-0 text-danger" title="Logout">
          <i class="bi bi-box-arrow-right fs-5"></i>
        </button>
      </div>
    </div>
  </nav>

  
  <main class="main">
    <div class="topbar">
      <div>
        <h2><i class="bi bi-grid-1x2 me-2"></i>Dashboard</h2>
        <span style="font-size:13px;color:var(--muted)">Welcome back, Admin — here's what's happening</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <input class="search-box" type="text" placeholder="🔍 Search companies, students…"
               v-model="searchQuery" @keyup.enter="search" />
        <button class="btn btn-sm btn-primary" @click="search">Search</button>
      </div>
    </div>

    <div class="content">
      
      <div v-if="loading" class="loading-spinner"><div class="pulse me-3"></div>Loading stats…</div>

      <template v-if="!loading && stats">
        
        <div class="row g-3 mb-4">
          <div class="col-6 col-md-3">
            <div class="stat-card">
              <div class="icon" style="background:rgba(37,99,235,.15)">
                <i class="bi bi-people-fill" style="color:var(--primary)"></i>
              </div>
              <div class="num">{{ stats.total_students }}</div>
              <div class="label">Total Students</div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="stat-card">
              <div class="icon" style="background:rgba(63,185,80,.15)">
                <i class="bi bi-building" style="color:var(--success)"></i>
              </div>
              <div class="num">{{ stats.total_companies }}</div>
              <div class="label">Companies</div>
              <span v-if="stats.pending_companies>0" class="badge-pill badge bg-warning text-dark">
                {{ stats.pending_companies }} pending
              </span>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="stat-card">
              <div class="icon" style="background:rgba(88,166,255,.15)">
                <i class="bi bi-briefcase-fill" style="color:var(--info)"></i>
              </div>
              <div class="num">{{ stats.total_drives }}</div>
              <div class="label">Placement Drives</div>
              <span v-if="stats.pending_drives>0" class="badge-pill badge bg-warning text-dark">
                {{ stats.pending_drives }} pending
              </span>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="stat-card">
              <div class="icon" style="background:rgba(63,185,80,.15)">
                <i class="bi bi-trophy-fill" style="color:var(--success)"></i>
              </div>
              <div class="num">{{ stats.selected_students }}</div>
              <div class="label">Students Selected</div>
            </div>
          </div>
        </div>

        
        <div class="row g-3 mb-4">
          
          <div class="col-md-5">
            <div class="chart-card">
              <h5><i class="bi bi-pie-chart-fill me-2" style="color:var(--primary)"></i>Application Status</h5>
              <canvas id="statusChart" height="220"></canvas>
            </div>
          </div>
          
          <div class="col-md-7">
            <div class="chart-card">
              <h5><i class="bi bi-graph-up me-2" style="color:var(--success)"></i>Monthly Application Trend</h5>
              <canvas id="trendChart" height="220"></canvas>
            </div>
          </div>
        </div>

        
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <div class="chart-card h-100">
              <h5><i class="bi bi-building me-2" style="color:var(--warning)"></i>Top Hiring Companies</h5>
              <canvas id="companiesChart" height="220"></canvas>
            </div>
          </div>
          <div class="col-md-8">
            <div class="data-card h-100">
              <div class="data-card-header">
                <h5><i class="bi bi-lightning-charge me-2"></i>Pending Approvals</h5>
                <div class="d-flex gap-2">
                  <a href="/admin/companies" class="btn btn-sm btn-outline-warning">Companies</a>
                  <a href="/admin/drives" class="btn btn-sm btn-outline-primary">Drives</a>
                </div>
              </div>
              <div class="p-3">
                <div class="row g-3">
                  <div class="col-sm-6">
                    <div style="background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.2);
                                border-radius:10px;padding:16px;text-align:center;">
                      <div style="font-size:28px;font-weight:700;color:var(--warning)">{{ stats.pending_companies }}</div>
                      <div style="font-size:13px;color:var(--muted)">Companies awaiting approval</div>
                      <a href="/admin/companies?status=pending" class="btn btn-sm btn-warning mt-2">Review Now</a>
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div style="background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.2);
                                border-radius:10px;padding:16px;text-align:center;">
                      <div style="font-size:28px;font-weight:700;color:var(--info)">{{ stats.pending_drives }}</div>
                      <div style="font-size:13px;color:var(--muted)">Drives awaiting approval</div>
                      <a href="/admin/drives?status=pending" class="btn btn-sm btn-info text-dark mt-2">Review Now</a>
                    </div>
                  </div>
                  <div class="col-12">
                    <div style="background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.2);
                                border-radius:10px;padding:16px;">
                      <div class="d-flex justify-content-between">
                        <span style="color:var(--muted);font-size:13px">Total Applications</span>
                        <strong>{{ stats.total_applications }}</strong>
                      </div>
                      <div class="d-flex justify-content-between mt-1">
                        <span style="color:var(--muted);font-size:13px">Approved Companies</span>
                        <strong>{{ stats.approved_companies }}</strong>
                      </div>
                      <div class="d-flex justify-content-between mt-1">
                        <span style="color:var(--muted);font-size:13px">Approved Drives</span>
                        <strong>{{ stats.approved_drives }}</strong>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        
        <div v-if="searchResults" class="data-card mb-4">
          <div class="data-card-header">
            <h5><i class="bi bi-search me-2"></i>Search Results for "{{ searchQuery }}"</h5>
            <button @click="searchResults=null" class="btn btn-sm btn-outline-secondary">Clear</button>
          </div>
          <div class="p-3">
            <div v-if="searchResults.companies && searchResults.companies.length">
              <p class="section-label mb-2">Companies</p>
              <div class="row g-2 mb-3">
                <div v-for="c in searchResults.companies" :key="c.id" class="col-md-4">
                  <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;">
                    <div class="fw-600">{{ c.company_name }}</div>
                    <div style="font-size:12px;color:var(--muted)">{{ c.industry }} · {{ c.email }}</div>
                    <span class="badge mt-1" :class="PPA.statusBadge(c.approval_status)">{{ c.approval_status }}</span>
                  </div>
                </div>
              </div>
            </div>
            <div v-if="searchResults.students && searchResults.students.length">
              <p class="section-label mb-2">Students</p>
              <div class="row g-2">
                <div v-for="s in searchResults.students" :key="s.id" class="col-md-4">
                  <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;">
                    <div class="fw-600">{{ s.full_name }}</div>
                    <div style="font-size:12px;color:var(--muted)">{{ s.roll_number }} · {{ s.branch }} · CGPA: {{ s.cgpa }}</div>
                  </div>
                </div>
              </div>
            </div>
            <div v-if="(!searchResults.companies||!searchResults.companies.length)&&(!searchResults.students||!searchResults.students.length)"
                 class="text-center py-4" style="color:var(--muted)">
              <i class="bi bi-search fs-3 mb-2 d-block"></i>No results found.
            </div>
          </div>
        </div>
      </template>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/static/components/api.js"></script>
<script>
Chart.defaults.color = '#8b949e';
Chart.defaults.borderColor = '#30363d';

const { createApp, ref, onMounted } = Vue;
createApp({
  setup() {
    if (!PPA.requireRole('admin')) return {};
    const stats = ref(null);
    const loading = ref(true);
    const searchQuery = ref('');
    const searchResults = ref(null);

    async function loadStats() {
      loading.value = true;
      const res = await PPA.get('/api/admin/dashboard');
      if (res && res.success) {
        stats.value = res.data;
        setTimeout(renderCharts, 100);
      }
      loading.value = false;
    }

    async function search() {
      if (!searchQuery.value.trim()) return;
      const res = await PPA.get(`/api/admin/search?q=${encodeURIComponent(searchQuery.value)}`);
      if (res && res.success) searchResults.value = res.data;
    }

    function renderCharts() {
      const s = stats.value;
      // Status Pie
      new Chart(document.getElementById('statusChart'), {
        type: 'doughnut',
        data: {
          labels: ['Applied','Shortlisted','Selected','Rejected'],
          datasets: [{
            data: [s.app_status_chart.applied, s.app_status_chart.shortlisted,
                   s.app_status_chart.selected, s.app_status_chart.rejected],
            backgroundColor: ['#2563eb','#06b6d4','#3fb950','#f85149'],
            borderWidth: 0,
          }]
        },
        options: { plugins: { legend: { position: 'bottom', labels: { padding: 16, boxWidth: 12 } } },
                   cutout: '65%', responsive: true, maintainAspectRatio: false }
      });

      // Monthly Trend
      new Chart(document.getElementById('trendChart'), {
        type: 'line',
        data: {
          labels: s.monthly_trend.map(m => m.month),
          datasets: [{
            label: 'Applications',
            data: s.monthly_trend.map(m => m.count),
            borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,.1)',
            fill: true, tension: 0.4, pointRadius: 5, pointBackgroundColor: '#2563eb',
          }]
        },
        options: { responsive: true, maintainAspectRatio: false,
                   plugins: { legend: { display: false } },
                   scales: { y: { beginAtZero: true, grid: { color: '#30363d' } },
                              x: { grid: { color: '#30363d' } } } }
      });

      // Top Companies Bar
      if (s.top_companies && s.top_companies.length) {
        new Chart(document.getElementById('companiesChart'), {
          type: 'bar',
          data: {
            labels: s.top_companies.map(c => c.name.substring(0,15)),
            datasets: [{
              label: 'Drives',
              data: s.top_companies.map(c => c.drives),
              backgroundColor: ['#2563eb','#3b82f6','#60a5fa','#93c5fd','#bfdbfe'],
              borderRadius: 6,
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y',
                     plugins: { legend: { display: false } },
                     scales: { x: { grid: { color: '#30363d' }, beginAtZero: true },
                                y: { grid: { display: false } } } }
        });
      }
    }

    function logout() { PPA.logout(); }

    onMounted(loadStats);
    return { stats, loading, searchQuery, searchResults, search, logout, PPA };
  }
}).mount('#app');
</script>
{% endraw %}
</body>
</html>
