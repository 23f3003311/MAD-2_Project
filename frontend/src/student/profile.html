<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>My Profile — PPA Student</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--primary:#2563eb;--text:#e6edf3;--muted:#8b949e;--success:#3fb950;--danger:#f85149;}
    *{box-sizing:border-box;}body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;margin:0;}
    .sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;}
    .sidebar-brand{padding:20px 16px;border-bottom:1px solid var(--border);}
    .sidebar-brand .logo{width:36px;height:36px;background:var(--primary);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;}
    .sidebar-brand span{font-weight:700;font-size:15px;margin-left:10px;vertical-align:middle;}
    .nav-link{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--muted);font-size:14px;border-radius:8px;margin:2px 8px;text-decoration:none;transition:all .2s;}
    .nav-link:hover,.nav-link.active{background:rgba(37,99,235,.15);color:var(--primary);}
    .nav-link i{font-size:16px;width:18px;}
    .sidebar-footer{margin-top:auto;padding:16px;border-top:1px solid var(--border);}
    .main{margin-left:240px;min-height:100vh;}
    .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
    .topbar h2{font-size:18px;font-weight:600;margin:0;}
    .content{padding:28px;max-width:900px;}
    .profile-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px;}
    .profile-header{background:linear-gradient(135deg,#1e3a8a,#1e40af);padding:28px;display:flex;align-items:center;gap:20px;}
    .avatar{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:white;}
    .profile-name{font-size:20px;font-weight:700;color:white;}
    .profile-sub{font-size:14px;color:rgba(255,255,255,.7);margin-top:2px;}
    .profile-body{padding:24px;}
    .section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:20px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--border);}
    .form-label{color:var(--muted);font-size:13px;font-weight:500;margin-bottom:5px;}
    .form-control,.form-select{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 13px;font-size:14px;}
    .form-control:focus,.form-select:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.2);color:var(--text);background:var(--bg);}
    .form-control::placeholder{color:var(--muted);}
    .form-select option{background:var(--surface);}
    .badge{font-size:11px;font-weight:500;padding:4px 10px;border-radius:999px;}
    .resume-box{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:border-color .2s;}
    .resume-box:hover{border-color:var(--primary);}
    .resume-box input{display:none;}
    .cgpa-bar-bg{background:var(--border);border-radius:999px;height:6px;overflow:hidden;margin-top:6px;}
    .cgpa-bar-fill{height:100%;border-radius:999px;transition:width .5s;}
  </style>
</head>
<body>
{% raw %}
<div id="app">
  <nav class="sidebar">
    <div class="sidebar-brand">
      <div class="logo d-inline-flex"><i class="bi bi-person-fill text-white"></i></div>
      <span>{{ form.full_name || 'Student' }}</span>
    </div>
    <div style="padding:12px 8px;">
      <a href="/student/dashboard" class="nav-link"><i class="bi bi-grid-1x2"></i> Dashboard</a>
      <a href="/student/profile" class="nav-link active"><i class="bi bi-person-circle"></i> My Profile</a>
      <a href="/student/applications" class="nav-link"><i class="bi bi-folder2-open"></i> My Applications</a>
    </div>
    <div class="sidebar-footer">
      <button @click="logout" class="btn btn-sm btn-outline-danger w-100"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
    </div>
  </nav>

  <main class="main">
    <div class="topbar">
      <h2><i class="bi bi-person-circle me-2"></i>My Profile</h2>
      <button class="btn btn-primary btn-sm" @click="saveProfile" :disabled="saving">
        <span v-if="saving" class="spinner-border spinner-border-sm me-1"></span>
        <i v-else class="bi bi-check-lg me-1"></i>{{ saving ? 'Saving…' : 'Save Changes' }}
      </button>
    </div>

    <div class="content">
      <div v-if="loading" class="text-center py-5" style="color:var(--muted)">
        <div class="spinner-border" style="color:var(--primary)"></div>
      </div>

      <template v-if="!loading">
        
        <div class="profile-card">
          <div class="profile-header">
            <div class="avatar">{{ initials }}</div>
            <div>
              <div class="profile-name">{{ form.full_name }}</div>
              <div class="profile-sub">{{ profile?.roll_number }} · {{ form.branch }} · Year {{ form.year }}</div>
              <div class="profile-sub">{{ PPA.getEmail() }}</div>
              <div class="mt-2 d-flex gap-2">
                <span class="badge" style="background:rgba(255,255,255,.2);color:white">
                  CGPA {{ form.cgpa }}
                </span>
                <span v-if="profile?.has_resume" class="badge" style="background:rgba(63,185,80,.3);color:#3fb950">
                  <i class="bi bi-file-earmark-check me-1"></i>Resume Uploaded
                </span>
              </div>
            </div>
          </div>

          <div class="profile-body">
            
            <div class="mb-3">
              <div class="d-flex justify-content-between">
                <span style="font-size:13px;color:var(--muted)">CGPA Progress</span>
                <span style="font-size:13px;font-weight:600">{{ form.cgpa }} / 10</span>
              </div>
              <div class="cgpa-bar-bg">
                <div class="cgpa-bar-fill"
                     :style="{width: (form.cgpa / 10 * 100) + '%', background: form.cgpa >= 8 ? 'var(--success)' : form.cgpa >= 6 ? 'var(--warning)' : 'var(--danger)'}">
                </div>
              </div>
            </div>

            <p class="section-title">Basic Information</p>
            <div class="row g-3">
              <div class="col-sm-6">
                <label class="form-label">Full Name *</label>
                <input v-model="form.full_name" type="text" class="form-control" required/>
              </div>
              <div class="col-sm-6">
                <label class="form-label">Phone</label>
                <input v-model="form.phone" type="tel" class="form-control" placeholder="+91 98765 43210"/>
              </div>
              <div class="col-sm-4">
                <label class="form-label">Branch *</label>
                <select v-model="form.branch" class="form-select">
                  <option v-for="b in branches" :key="b" :value="b">{{ b }}</option>
                </select>
              </div>
              <div class="col-sm-4">
                <label class="form-label">Year *</label>
                <select v-model="form.year" class="form-select">
                  <option value="1">1st Year</option><option value="2">2nd Year</option>
                  <option value="3">3rd Year</option><option value="4">4th Year</option>
                </select>
              </div>
              <div class="col-sm-4">
                <label class="form-label">CGPA *</label>
                <input v-model="form.cgpa" type="number" class="form-control" min="0" max="10" step="0.01"/>
              </div>
            </div>

            <p class="section-title">Links & Skills</p>
            <div class="row g-3">
              <div class="col-sm-6">
                <label class="form-label"><i class="bi bi-linkedin me-1" style="color:#0a66c2"></i>LinkedIn URL</label>
                <input v-model="form.linkedin" type="url" class="form-control" placeholder="https://linkedin.com/in/…"/>
              </div>
              <div class="col-sm-6">
                <label class="form-label"><i class="bi bi-github me-1"></i>GitHub URL</label>
                <input v-model="form.github" type="url" class="form-control" placeholder="https://github.com/…"/>
              </div>
              <div class="col-12">
                <label class="form-label">Skills (comma-separated)</label>
                <input v-model="form.skills" type="text" class="form-control"
                       placeholder="Python, React, Machine Learning, SQL…"/>
              </div>
              <div class="col-12">
                <label class="form-label">Address</label>
                <textarea v-model="form.address" class="form-control" rows="2" placeholder="Your address…"></textarea>
              </div>
            </div>

            <p class="section-title">Resume</p>
            <div class="row g-3">
              <div class="col-md-8">
                <label class="resume-box" for="resumeFile">
                  <i class="bi bi-cloud-upload fs-2 mb-2 d-block" style="color:var(--primary)"></i>
                  <div v-if="profile?.has_resume">
                    <strong>{{ profile.resume_filename }}</strong><br>
                    <span style="font-size:13px;color:var(--muted)">Click to replace resume</span>
                  </div>
                  <div v-else>
                    <strong>Upload Resume</strong><br>
                    <span style="font-size:13px;color:var(--muted)">PDF, DOC, or DOCX · Max 16 MB</span>
                  </div>
                  <input type="file" id="resumeFile" @change="uploadResume" accept=".pdf,.doc,.docx"/>
                </label>
              </div>
              <div class="col-md-4" v-if="profile?.has_resume">
                <div style="background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.2);border-radius:10px;padding:16px;text-align:center;">
                  <i class="bi bi-file-earmark-check fs-2 mb-2 d-block" style="color:var(--success)"></i>
                  <div style="font-size:13px;font-weight:600">Resume Uploaded</div>
                  <div style="font-size:12px;color:var(--muted)">{{ profile.resume_filename }}</div>
                  <a href="/api/student/profile/resume" class="btn btn-sm btn-outline-success mt-2">
                    <i class="bi bi-download me-1"></i>Download
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>

        
        <button class="btn btn-primary w-100" @click="saveProfile" :disabled="saving">
          <span v-if="saving" class="spinner-border spinner-border-sm me-1"></span>
          {{ saving ? 'Saving…' : 'Save Profile' }}
        </button>
      </template>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="/static/components/api.js"></script>
<script>
const { createApp, ref, reactive, computed, onMounted } = Vue;
createApp({
  setup() {
    if (!PPA.requireRole('student')) return {};
    const profile = ref(null);
    const loading = ref(true);
    const saving = ref(false);
    const form = reactive({
      full_name:'', phone:'', branch:'', year:3, cgpa:0,
      linkedin:'', github:'', skills:'', address:'',
    });
    const branches = ['Computer Science','Information Technology','Electronics & Communication',
      'Electrical Engineering','Mechanical Engineering','Civil Engineering','Chemical Engineering','Biotechnology'];
    const initials = computed(() => {
      const parts = (form.full_name||'S').trim().split(' ');
      return parts.map(p => p[0]||'').join('').toUpperCase().slice(0,2);
    });

    async function loadProfile() {
      loading.value = true;
      const res = await PPA.get('/api/student/profile');
      if (res && res.success) {
        profile.value = res.data;
        Object.assign(form, {
          full_name: res.data.full_name||'',
          phone: res.data.phone||'',
          branch: res.data.branch||'',
          year: res.data.year||3,
          cgpa: res.data.cgpa||0,
          linkedin: res.data.linkedin||'',
          github: res.data.github||'',
          skills: res.data.skills||'',
          address: res.data.address||'',
        });
      }
      loading.value = false;
    }

    async function saveProfile() {
      if (!form.full_name.trim()) { PPA.toast('Full name is required.', 'danger'); return; }
      const cgpa = parseFloat(form.cgpa);
      if (isNaN(cgpa) || cgpa < 0 || cgpa > 10) { PPA.toast('CGPA must be 0–10.', 'danger'); return; }

      saving.value = true;
      const res = await PPA.put('/api/student/profile', {
        ...form, cgpa: parseFloat(form.cgpa), year: parseInt(form.year),
      });
      if (res && res.success) {
        profile.value = res.data;
        PPA.toast('Profile saved successfully!', 'success');
      } else PPA.toast(res?.message || 'Error saving.', 'danger');
      saving.value = false;
    }

    async function uploadResume(e) {
      const file = e.target.files[0];
      if (!file) return;
      const allowed = ['application/pdf','application/msword',
        'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
      if (!allowed.includes(file.type)) { PPA.toast('Only PDF, DOC, DOCX allowed.', 'danger'); return; }
      if (file.size > 16 * 1024 * 1024) { PPA.toast('File too large (max 16MB).', 'danger'); return; }
      const fd = new FormData(); fd.append('resume', file);
      const res = await PPA.upload('/api/student/profile/resume', fd);
      if (res && res.success) {
        PPA.toast('Resume uploaded!', 'success');
        loadProfile();
      } else PPA.toast(res?.message || 'Upload failed.', 'danger');
    }

    function logout() { PPA.logout(); }
    onMounted(loadProfile);
    return { profile, loading, saving, form, branches, initials, saveProfile, uploadResume, logout, PPA };
  }
}).mount('#app');
</script>
{% endraw %}
</body>
</html>
