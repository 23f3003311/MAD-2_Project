<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Company Dashboard — PPA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--primary:#2563eb;--text:#e6edf3;--muted:#8b949e;--success:#3fb950;--danger:#f85149;--warning:#d29922;--info:#58a6ff;}
    *{box-sizing:border-box;}body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;margin:0;}
    .sidebar{position:fixed;top:0;left:0;width:240px;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;}
    .sidebar-brand{padding:20px 16px;border-bottom:1px solid var(--border);}
    .sidebar-brand .logo{width:36px;height:36px;background:var(--primary);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;}
    .sidebar-brand span{font-weight:700;font-size:15px;margin-left:10px;vertical-align:middle;}
    .nav-link{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--muted);font-size:14px;border-radius:8px;margin:2px 8px;text-decoration:none;transition:all .2s;}
    .nav-link:hover,.nav-link.active{background:rgba(37,99,235,.15);color:var(--primary);}
    .nav-link i{font-size:16px;width:18px;}
    .sidebar-footer{margin-top:auto;padding:16px;border-top:1px solid var(--border);}
    .main{margin-left:240px;min-height:100vh;}
    .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
    .topbar h2{font-size:18px;font-weight:600;margin:0;}
    .content{padding:28px;}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;transition:transform .2s;}
    .stat-card:hover{transform:translateY(-2px);}
    .stat-card .icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;}
    .stat-card .num{font-size:32px;font-weight:700;margin:8px 0 2px;}
    .stat-card .label{font-size:13px;color:var(--muted);}
    .data-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;}
    .data-card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    .data-card-header h5{margin:0;font-size:15px;font-weight:600;}
    .table{--bs-table-bg:transparent;--bs-table-color:var(--text);--bs-table-border-color:var(--border);font-size:14px;margin:0;}
    .table th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px;padding:12px 16px;border-bottom:1px solid var(--border)!important;}
    .table td{padding:12px 16px;vertical-align:middle;border-bottom:1px solid rgba(48,54,61,.6);}
    .badge{font-size:11px;font-weight:500;padding:4px 10px;border-radius:999px;}
    .info-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;}
    .info-row{display:flex;gap:8px;margin-bottom:10px;font-size:14px;}
    .info-label{color:var(--muted);min-width:140px;font-weight:500;}
    .pending-banner{background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.3);border-radius:10px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;}
  </style>
</head>
<body>
{% raw %}
<div id="app">
  <nav class="sidebar">
    <div class="sidebar-brand">
      <div class="logo d-inline-flex"><i class="bi bi-building text-white"></i></div>
      <span>{{ companyName }}</span>
    </div>
    <div style="padding:12px 8px;">
      <a href="/company/dashboard" class="nav-link active"><i class="bi bi-grid-1x2"></i> Dashboard</a>
      <a href="/company/drives" class="nav-link"><i class="bi bi-briefcase"></i> Drives</a>
      <a href="/company/applications" class="nav-link"><i class="bi bi-people"></i> Applications</a>
    </div>
    <div class="sidebar-footer">
      <button @click="logout" class="btn btn-sm btn-outline-danger w-100"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
    </div>
  </nav>

  <main class="main">
    <div class="topbar">
      <div>
        <h2><i class="bi bi-grid-1x2 me-2"></i>Company Dashboard</h2>
        <span style="font-size:13px;color:var(--muted)">Welcome back, {{ companyName }}</span>
      </div>
      <a href="/company/drives" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-lg me-1"></i>Create Drive
      </a>
    </div>

    <div class="content">
      <div v-if="loading" class="text-center py-5" style="color:var(--muted)">
        <div class="spinner-border" style="color:var(--primary)"></div>
      </div>

      <template v-if="!loading && dashboard">
        
        <div v-if="dashboard.company.approval_status !== 'approved'" class="pending-banner">
          <i class="bi bi-hourglass-split fs-4" style="color:var(--warning)"></i>
          <div>
            <div style="font-weight:600;color:var(--warning)">Account Pending Approval</div>
            <div style="font-size:13px;color:var(--muted)">
              Your company registration is under review. You can create drives once approved.
            </div>
          </div>
        </div>

        
        <div class="row g-3 mb-4">
          <div class="col-6 col-md-3">
            <div class="stat-card">
              <div class="icon" style="background:rgba(37,99,235,.15)"><i class="bi bi-briefcase-fill" style="color:var(--primary)"></i></div>
              <div class="num">{{ dashboard.total_drives }}</div>
              <div class="label">Total Drives</div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="stat-card">
              <div class="icon" style="background:rgba(88,166,255,.15)"><i class="bi bi-people-fill" style="color:var(--info)"></i></div>
              <div class="num">{{ dashboard.total_applicants }}</div>
              <div class="label">Total Applicants</div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="stat-card">
              <div class="icon" style="background:rgba(63,185,80,.15)"><i class="bi bi-trophy-fill" style="color:var(--success)"></i></div>
              <div class="num">{{ dashboard.total_selected }}</div>
              <div class="label">Selected</div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="stat-card">
              <div class="icon" style="background:rgba(210,153,34,.15)"><i class="bi bi-clock-fill" style="color:var(--warning)"></i></div>
              <div class="num">{{ activeDrives }}</div>
              <div class="label">Active Drives</div>
            </div>
          </div>
        </div>

        
        <div class="row g-3 mb-4">
          <div class="col-md-5">
            <div class="info-card h-100">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 style="font-size:15px;font-weight:600;margin:0"><i class="bi bi-building me-2"></i>Company Profile</h5>
                <span :class="PPA.statusBadge(dashboard.company.approval_status)">{{ dashboard.company.approval_status }}</span>
              </div>
              <div class="info-row"><span class="info-label">Name:</span><span>{{ dashboard.company.company_name }}</span></div>
              <div class="info-row"><span class="info-label">Industry:</span><span>{{ dashboard.company.industry||'—' }}</span></div>
              <div class="info-row"><span class="info-label">HR Contact:</span><span>{{ dashboard.company.hr_contact||'—' }}</span></div>
              <div class="info-row"><span class="info-label">HR Email:</span><span>{{ dashboard.company.hr_email||'—' }}</span></div>
              <div class="info-row"><span class="info-label">Website:</span>
                <a v-if="dashboard.company.website" :href="dashboard.company.website" target="_blank" style="color:var(--primary)">{{ dashboard.company.website }}</a>
                <span v-else>—</span>
              </div>
            </div>
          </div>

          
          <div class="col-md-7">
            <div class="data-card h-100">
              <div class="data-card-header">
                <h5>Placement Drives</h5>
                <a href="/company/drives" class="btn btn-sm btn-outline-primary">View All</a>
              </div>
              <div v-if="dashboard.drives.length===0" class="text-center py-4" style="color:var(--muted)">
                <i class="bi bi-briefcase fs-2 mb-2 d-block"></i>No drives yet.
                <a href="/company/drives" class="btn btn-primary btn-sm mt-2">Create First Drive</a>
              </div>
              <div v-else class="table-responsive">
                <table class="table">
                  <thead><tr><th>Title</th><th>Applicants</th><th>Selected</th><th>Status</th></tr></thead>
                  <tbody>
                    <tr v-for="d in dashboard.drives.slice(0,5)" :key="d.id">
                      <td>
                        <div class="fw-semibold" style="font-size:13px">{{ d.job_title }}</div>
                        <div style="font-size:11px;color:var(--muted)">Deadline: {{ PPA.formatDate(d.deadline) }}</div>
                      </td>
                      <td><span class="badge bg-primary">{{ d.total }}</span></td>
                      <td><span class="badge bg-success">{{ d.selected }}</span></td>
                      <td><span :class="PPA.statusBadge(d.status)">{{ d.status }}</span></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="/static/components/api.js"></script>
<script>
const { createApp, ref, computed, onMounted } = Vue;
createApp({
  setup() {
    if (!PPA.requireRole('company')) return {};
    const dashboard = ref(null);
    const loading = ref(true);
    const companyName = ref(PPA.getName() || 'Company');
    const activeDrives = computed(() =>
      dashboard.value?.drives.filter(d => d.status === 'approved').length || 0
    );

    async function loadDashboard() {
      loading.value = true;
      const res = await PPA.get('/api/company/dashboard');
      if (res && res.success) dashboard.value = res.data;
      loading.value = false;
    }
    function logout() { PPA.logout(); }
    onMounted(loadDashboard);
    return { dashboard, loading, companyName, activeDrives, logout, PPA };
  }
}).mount('#app');
</script>
{% endraw %}
</body>
</html>
